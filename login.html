<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Gestion Cellules</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans text-slate-800 antialiased">

  <div class="w-full max-w-sm sm:max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/90 p-6 sm:p-8">
    
    <!-- En-tête avec Logo -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center mx-auto mb-3 shadow-md">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H7" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Espace Connexion</h1>
      <p class="text-xs sm:text-sm text-slate-500 mt-1">Saisissez vos identifiants pour accéder à l'application</p>
    </div>

    <!-- Formulaire de Connexion -->
    <form action="index.html" method="GET" class="space-y-5">

      <!-- Nom d'utilisateur -->
      <div>
        <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Nom d'utilisateur</label>
        <div class="relative">
          <input type="text" id="username" name="username" placeholder="Ex: henock_t" required autocomplete="username"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none transition text-base text-slate-800 placeholder:text-slate-400">
        </div>
      </div>

      <!-- Mot de passe -->
      <div>
        <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Mot de passe</label>
        <div class="relative">
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 outline-none transition text-base text-slate-800 placeholder:text-slate-400">
        </div>
      </div>

      <!-- Bouton Se Connecter -->
      <div class="pt-2">
        <button type="submit"
          class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md shadow-indigo-200 transition duration-200 active:scale-[0.99] flex items-center justify-center gap-2">
          <span>Se connecter</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </div>

    </form>

    <!-- Pied de carte confidentiel -->
    <div class="mt-8 pt-4 border-t border-slate-100 text-center">
      <p class="text-[11px] text-slate-400">Accès restreint aux responsables de cellule</p>
    </div>

  </div>

</body>
</html>
