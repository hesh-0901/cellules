<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapport de Cellule</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans text-slate-800">

  <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-slate-200/80 p-6 sm:p-8">
    
    <!-- En-tête -->
    <div class="mb-6 text-center sm:text-left border-b border-slate-100 pb-4">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">Rapport de Cellule</h1>
      <p class="text-sm text-slate-500 mt-1">Veuillez remplir les informations de la rencontre.</p>
    </div>

    <!-- Formulaire -->
    <form id="celluleForm" class="space-y-5">

      <!-- Cellule -->
      <div>
        <label for="cellule" class="block text-sm font-semibold text-slate-700 mb-1">Nom / Numéro de la Cellule</label>
        <input type="text" id="cellule" name="cellule" placeholder="Ex: Bethanie 1" required
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
      </div>

      <!-- Effectifs (Hommes & Femmes côte à côte) -->
      <div class="grid grid-cols-2 gap-3 sm:gap-4">
        <div>
          <label for="hommes" class="block text-sm font-semibold text-slate-700 mb-1">Hommes</label>
          <input type="number" id="hommes" name="hommes" min="0" placeholder="0" required
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
        </div>
        <div>
          <label for="femmes" class="block text-sm font-semibold text-slate-700 mb-1">Femmes</label>
          <input type="number" id="femmes" name="femmes" min="0" placeholder="0" required
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
        </div>
      </div>

      <!-- Nouveaux venus -->
      <div>
        <label for="nouveaux" class="block text-sm font-semibold text-slate-700 mb-1">Nouveaux venus</label>
        <input type="number" id="nouveaux" name="nouveaux" min="0" placeholder="0" required
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
      </div>

      <!-- Thème -->
      <div>
        <label for="theme" class="block text-sm font-semibold text-slate-700 mb-1">Thème de l'enseignement</label>
        <input type="text" id="theme" name="theme" placeholder="Ex: La puissance de la prière" required
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
      </div>

      <!-- Prédicateur -->
      <div>
        <label for="predicateur" class="block text-sm font-semibold text-slate-700 mb-1">Prédicateur</label>
        <input type="text" id="predicateur" name="predicateur" placeholder="Nom de l'intervenant" required
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
      </div>

      <!-- Textes bibliques -->
      <div>
        <label for="textes" class="block text-sm font-semibold text-slate-700 mb-1">Textes bibliques</label>
        <input type="text" id="textes" name="textes" placeholder="Ex: Jean 3:16, Psaumes 23" required
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
      </div>

      <!-- Offrandes -->
      <div>
        <label for="offrandes" class="block text-sm font-semibold text-slate-700 mb-1">Offrandes reçues</label>
        <div class="relative">
          <input type="number" step="0.01" id="offrandes" name="offrandes" placeholder="0.00" required
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base">
        </div>
      </div>

      <!-- Horaires (1 colonne sur mobile, 2 sur écrans plus larges) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
        <div>
          <label for="heure_debut" class="block text-sm font-semibold text-slate-700 mb-1">Heure de début</label>
          <input type="time" id="heure_debut" name="heure_debut" required
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base bg-white appearance-none min-w-0">
        </div>
        <div>
          <label for="heure_fin" class="block text-sm font-semibold text-slate-700 mb-1">Heure de fin</label>
          <input type="time" id="heure_fin" name="heure_fin" required
            class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition text-base bg-white appearance-none min-w-0">
        </div>
      </div>

      <!-- Bouton de soumission -->
      <div class="pt-4">
        <button type="submit"
          class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-200 transition duration-200 active:scale-[0.99]">
          Enregistrer le rapport
        </button>
      </div>

    </form>
  </div>

</body>
</html>
